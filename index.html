<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Дневник питания</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: одна колонка до 560px, три раздела (Сегодня, Прогресс, Я), нижняя навигация, шторка для добавления еды */
:root{
  --h:350;
  --bg:oklch(0.975 0.01 var(--h));
  --surface:oklch(0.997 0.004 var(--h));
  --surface2:oklch(0.95 0.016 var(--h));
  --line:oklch(0.89 0.022 var(--h));
  --fg:oklch(0.26 0.035 var(--h));
  --muted:oklch(0.5 0.035 var(--h));
  --accent:oklch(0.54 0.17 var(--h));
  --accent-fg:oklch(0.99 0.005 var(--h));
  --accent-soft:oklch(0.93 0.045 var(--h));
  --p:oklch(0.54 0.13 240);
  --f:oklch(0.66 0.14 75);
  --c:oklch(0.56 0.12 160);
  --warn:oklch(0.58 0.15 45);
  --scrim:oklch(0.2 0.03 var(--h) / 0.45);
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:oklch(0.2 0.022 var(--h));
    --surface:oklch(0.25 0.026 var(--h));
    --surface2:oklch(0.295 0.03 var(--h));
    --line:oklch(0.35 0.03 var(--h));
    --fg:oklch(0.94 0.012 var(--h));
    --muted:oklch(0.74 0.035 var(--h));
    --accent:oklch(0.76 0.13 var(--h));
    --accent-fg:oklch(0.2 0.03 var(--h));
    --accent-soft:oklch(0.33 0.065 var(--h));
    --p:oklch(0.76 0.12 240);
    --f:oklch(0.8 0.13 75);
    --c:oklch(0.76 0.12 160);
    --warn:oklch(0.76 0.13 50);
    --scrim:oklch(0.1 0.02 var(--h) / 0.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:oklch(0.2 0.022 var(--h));
  --surface:oklch(0.25 0.026 var(--h));
  --surface2:oklch(0.295 0.03 var(--h));
  --line:oklch(0.35 0.03 var(--h));
  --fg:oklch(0.94 0.012 var(--h));
  --muted:oklch(0.74 0.035 var(--h));
  --accent:oklch(0.76 0.13 var(--h));
  --accent-fg:oklch(0.2 0.03 var(--h));
  --accent-soft:oklch(0.33 0.065 var(--h));
  --p:oklch(0.76 0.12 240);
  --f:oklch(0.8 0.13 75);
  --c:oklch(0.76 0.12 160);
  --warn:oklch(0.76 0.13 50);
  --scrim:oklch(0.1 0.02 var(--h) / 0.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 104px}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:700;text-wrap:balance;letter-spacing:-0.01em}
h2{font-size:19px}
h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a,button,select,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.btn{background:var(--accent);color:var(--accent-fg);border-radius:12px;padding:11px 16px;font-weight:700;text-align:center}
.btn.ghost{background:var(--surface2);color:var(--fg);font-weight:600}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;min-width:0}
textarea{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:360px){.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font-size:25px;line-height:1.1}
.phrase{margin-top:6px;color:var(--muted);font-size:14px;max-width:34ch}
.daynav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px}
.daynav button{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.daynav button:hover{background:var(--surface2)}
.daynav .d{min-width:84px;text-align:center;font-weight:700;font-size:14px;padding:0 4px}

/* photo */
.hero{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/3;margin-bottom:14px;background:var(--surface2)}
.hero svg{width:100%;height:100%;display:block}
.hero .shade{position:absolute;inset:0;background:linear-gradient(to top,oklch(0.15 0.03 var(--h) / 0.85),transparent 55%)}
.hero .hn{position:absolute;top:10px;right:10px}
.hero .hello{position:absolute;left:16px;right:16px;bottom:14px;color:oklch(0.99 0 0)}
.hero .hello h1{font-size:28px;line-height:1.1}
.hero .hello .phrase{color:oklch(0.96 0.01 var(--h));margin-top:5px}
.ava{width:48px;height:48px;border-radius:50%;flex:none;border:2px solid var(--accent)}
.ava.mono{display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--font-display);font-weight:700;font-size:22px}
/* ring */
.sum{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:var(--surface2)}
.ring .fg{stroke:var(--accent);transition:stroke-dasharray .4s}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-family:var(--font-display);font-size:29px;font-weight:700;line-height:1}
.macros{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.mac .head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;gap:6px}
.mac .head b{font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;width:0;transition:width .4s}
.hint{margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:14px}

/* water & steps */
.glasses{display:flex;flex-wrap:wrap;gap:6px}
.glass{width:26px;height:34px;border-radius:5px 5px 9px 9px;border:2px solid var(--line);background:transparent;position:relative;overflow:hidden}
.glass.on{border-color:var(--p);background:color-mix(in oklab,var(--p) 55%,transparent)}
.step{width:36px;height:36px;border-radius:11px;background:var(--surface2);font-weight:700;font-size:18px;display:grid;place-items:center}

/* meals */
.meal-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.meal-h .k{font-size:13px}
.entry{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.entry .name{background:none;text-align:left;font-weight:600;overflow-wrap:anywhere}
.entry .x{width:30px;height:30px;border-radius:9px;color:var(--muted);display:grid;place-items:center;flex:none}
.entry .x:hover{background:var(--surface2)}
.empty{color:var(--muted);font-size:14px;padding:6px 0 2px}
.addrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:12px;color:var(--muted);font-size:12px;font-weight:700;text-decoration:none}
.nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current=page]{color:var(--accent);background:var(--accent-soft)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:4px;background:var(--surface2);border-radius:12px;padding:3px;overflow-x:auto;flex:none}
.tabs button{flex:1 0 auto;padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--surface);color:var(--fg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;padding:6px 12px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.food{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.food .pick{flex:1;min-width:0;text-align:left;background:none}
.food .pick b{display:block;font-weight:600;overflow-wrap:anywhere}
.star{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.star svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.star.on{color:var(--f)}
.star.on svg{fill:currentColor}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.preview div{background:var(--surface2);border-radius:12px;padding:8px 2px}
.preview b{display:block;font-family:var(--font-display);font-size:18px}
.preview span{font-size:12px;color:var(--muted)}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface2);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
.wrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}

/* settings */
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;background:oklch(0.62 0.16 var(--sh))}
.sw[aria-pressed=true]{border-color:var(--fg)}
.targets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.targets div{background:var(--surface2);border-radius:12px;padding:8px 10px}
.targets b{font-family:var(--font-display);font-size:18px;display:block}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;max-width:90%}
/* week + calendar */
.wkbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.datebtn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px;min-width:0}
.datebtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.datebtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;flex:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px;touch-action:pan-y}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.wd .n{font-family:var(--font-display);font-size:18px;font-weight:700;line-height:1}
.wd .w{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.wd .dot,.cd .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.wd.has .dot,.cd.has .dot{background:var(--accent)}
.wd.now{border-color:var(--accent)}
.wd.now .n{color:var(--accent)}
.wd[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
.wd[aria-pressed=true] .w,.wd[aria-pressed=true] .n{color:var(--accent-fg)}
.wd[aria-pressed=true].has .dot{background:var(--accent-fg)}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead button{width:42px;height:42px;border-radius:12px;background:var(--surface2);display:grid;place-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase}
.cd{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--fg);min-width:0;max-width:100%}
.cd.blank{background:transparent;border-color:transparent}
.cd.now{border-color:var(--accent);color:var(--accent)}
.cd.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cd.sel.has .dot{background:var(--accent-fg)}
/* chips wrap, voice, recipes */
.chips.wrap{flex-wrap:wrap;overflow:visible}
.xb{width:34px;height:34px;border-radius:10px;color:var(--muted);display:grid;place-items:center;flex:none}
.xb:hover{background:var(--surface2)}
.vitem{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.rcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.dish{display:block;flex:none;border-radius:16px;background:var(--accent-soft);object-fit:cover}
.rc{display:flex;gap:12px;align-items:center}
.rc .dish{width:72px;height:72px}
.rc .tx{min-width:0;flex:1}
.dish.big{width:min(210px,62%);height:auto;aspect-ratio:1;margin:0 auto}
.rcard .rt{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.rcard .rm{margin-top:6px;font-size:14px}
.miss{margin-top:6px;font-size:13px;color:var(--warn)}
.ing{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.ing .no{color:var(--warn)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:38px;height:38px;border-radius:12px;background:var(--surface2);font-size:20px;font-weight:700}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* v13: клавиатура и окно добавления */
input[type=text],input[type=number],input[type=search],select,textarea{font-size:16px}
html.sheet-open,html.sheet-open body{overscroll-behavior:none}
body.locked{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.scrim{inset:auto;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%)}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* v11: тренировки, напоминания, шаблоны, отчёт */
.remind{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--accent-soft);border:1px solid var(--line)}
.remind .rt{flex:1;min-width:0;font-size:14px}
.remind b{font-weight:700}
.wkrow{display:flex;gap:8px;align-items:center}
.wkrow select{flex:1.4}.wkrow input{flex:1;min-width:0}
.tpl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rep li{margin:0 0 4px}
.rep ul{margin:0;padding-left:18px}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wnav button{width:34px;height:34px;border-radius:11px;background:var(--surface2);font-weight:700}
.wnav button[disabled]{opacity:.4}

/* история */
function buildHistory(){
  var H={},seq=0;
  Object.keys(S.log).sort().forEach(function(d){
    if(d>TODAY)return;
    S.log[d].forEach(function(e){
      var key=e.fid||("q:"+e.n);
      var h=H[key]||(H[key]={key:key,fid:e.fid||"",n:e.n,cnt:0,seq:0,bm:{},g:0,sample:null});
      h.cnt++;h.seq=++seq;h.bm[e.m]=(h.bm[e.m]||0)+1;h.g=e.g||0;h.sample=e
    })
  });
  return H
}
function histRows(){
  var H=buildHistory(),arr=[];
  for(var k in H){
    var h=H[k];
    if(h.fid){var f=foodById(h.fid);if(!f)continue;h.food=f}else h.food=null;
    if(A.hm&&!h.bm[A.m])continue;
    h.c=A.hm?h.bm[A.m]:h.cnt;
    arr.push(h)
  }
  arr.sort(A.hf==="freq"?function(a,b){return b.c-a.c||b.seq-a.seq}:function(a,b){return b.seq-a.seq});
  return arr.slice(0,40)
}

var NUMW={"ноль":0,"один":1,"одна":1,"одну":1,"одно":1,"два":2,"две":2,"три":3,"четыре":4,"пять":5,"шесть":6,"семь":7,"восемь":8,"девять":9,"десять":10,"одиннадцать":11,"двенадцать":12,"тринадцать":13,"четырнадцать":14,"пятнадцать":15,"шестнадцать":16,"семнадцать":17,"восемнадцать":18,"девятнадцать":19,"двадцать":20,"тридцать":30,"сорок":40,"пятьдесят":50,"шестьдесят":60,"семьдесят":70,"восемьдесят":80,"девяносто":90,"сто":100,"двести":200,"триста":300,"четыреста":400,"пятьсот":500,"шестьсот":600,"семьсот":700,"восемьсот":800,"девятьсот":900};

var ALIAS={"курица":"куриная грудка","курицу":"куриная грудка","курицы":"куриная грудка","курочка":"куриная грудка","курочку":"куриная грудка","яйца":"яйцо","яиц":"яйцо","яичко":"яйцо","картошка":"картофель","картошку":"картофель","картошки":"картофель","картошечка":"картофель"};
function wordsToDigits(toks){
  var out=[],i=0;
  while(i<toks.length){
    var w=toks[i];
    if(w==="полтора"||w==="полторы"){out.push("1.5");i++;continue}
    if(w==="половина"||w==="половинка"||w==="пол"){out.push("0.5");i++;continue}
    if(w==="четверть"){out.push("0.25");i++;continue}
    if(NUMW.hasOwnProperty(w)){var sum=0;while(i<toks.length&&NUMW.hasOwnProperty(toks[i])){sum+=NUMW[toks[i]];i++}out.push(String(sum));continue}
    out.push(w);i++
  }
  return out
}
function unitAt(toks,i){
  var t=toks[i],u=toks[i+1];
  if(!t)return null;
  if(/^(г|гр|грам[а-я]*)$/.test(t))return {m:"g",x:1,n:1};
  if(/^(кг|килограмм[а-я]*|кило)$/.test(t))return {m:"g",x:1000,n:1};
  if(/^(мл|миллилитр[а-я]*)$/.test(t))return {m:"g",x:1,n:1};
  if(/^(л|литр[а-я]*)$/.test(t))return {m:"g",x:1000,n:1};
  if(/^(шт|штук[а-я]*|штучк[а-я]*)$/.test(t))return {m:"pc",n:1};
  if(/^столов[а-я]*$/.test(t)&&u&&/^ложк[а-я]*$/.test(u))return {m:"g",x:15,n:2};
  if(/^чайн[а-я]*$/.test(t)&&u&&/^ложк[а-я]*$/.test(u))return {m:"g",x:5,n:2};
  if(/^(ложк[а-я]*|ложек)$/.test(t))return {m:"g",x:15,n:1};
  if(/^(стакан[а-я]*|чашк[а-я]*|кружк[а-я]*)$/.test(t))return {m:"g",x:200,n:1};
  if(/^(кусок|кусоч[а-я]*|куск[а-я]*|ломтик[а-я]*|ломт[а-я]*|порци[а-я]*|тарелк[а-я]*|миск[а-я]*)$/.test(t))return {m:"pc",n:1};
  return null
}
var FT={};
function ftoks(f){var t=FT[f.id];if(!t){t=norm(f.n+" "+(SYN[f.n]||"")).split(/[^a-zа-я0-9]+/).filter(Boolean);FT[f.id]=t}return t}
function stem(w){return w.slice(0,Math.max(3,Math.min(4,w.length-1)))}
function matchFoods(qt,H){
  var q=[];
  qt.forEach(function(w){var a=ALIAS[w];if(a)a.split(" ").forEach(function(x){q.push(x)});else q.push(w)});
  if(!q.length)return [];
  var wantRaw=q.some(function(w){return /^(сыр|жарен|запечен|сух|свеж|тушен)/.test(w)});
  var res=[];
  allFoods().forEach(function(f){
    var ft=ftoks(f),m=0,bonus=0;
    q.forEach(function(w){
      var st=stem(w),hit=false;
      for(var i=0;i<ft.length;i++){if(ft[i].indexOf(st)===0){hit=true;if(ft[i]===w)bonus+=15;break}}
      if(hit)m++
    });
    if(m<q.length)return;
    if(!wantRaw&&ft.some(function(t){return /^варен/.test(t)}))bonus+=6;
    var h=H[f.id];
    var sc=100-(ft.length-m)*10-f.n.length*0.15+(h?Math.min(h.cnt,10)*4:0)+(S.favs.indexOf(f.id)>=0?6:0)+(f.br?-3:0)+bonus;
    res.push({f:f,s:sc})
  });
  res.sort(function(a,b){return b.s-a.s});
  return res.slice(0,6).map(function(x){return x.f})
}
function parseFoods(text){
  var H=buildHistory();
  var s=norm(text).replace(/(\d),(\d)/g,"$1.$2").replace(/(^|\s)ст\.?\s?л\.?(?=\s|,|$)/g,"$1столовая ложка").replace(/(^|\s)ч\.?\s?л\.?(?=\s|,|$)/g,"$1чайная ложка");
  s=s.replace(/[;\n]+/g,"|").replace(/,/g,"|").replace(/\s+(и|плюс|потом|затем|еще)\s+/g,"|");
  var segs=s.split("|").map(function(x){return x.trim()}).filter(Boolean),items=[],un=[];
  segs.forEach(function(seg){
    var toks=seg.replace(/[!?()«»"]/g," ").replace(/([^\d])\./g,"$1 ").replace(/(\d)([а-я])/g,"$1 $2").replace(/([а-я])(\d)/g,"$1 $2").split(/\s+/).filter(Boolean);
    toks=wordsToDigits(toks);
    var spec=null,used={},i,j;
    for(i=0;i<toks.length&&!spec;i++){
      if(/^\d+(\.\d+)?$/.test(toks[i])){
        var n=parseFloat(toks[i]),u=unitAt(toks,i+1);
        used[i]=1;
        if(u){for(j=0;j<u.n;j++)used[i+1+j]=1;spec=u.m==="g"?{m:"g",v:n*u.x}:{m:"pc",v:n}}
        else spec=n>=20?{m:"g",v:n}:{m:"pc",v:n}
      }
    }
    if(!spec){
      for(i=0;i<toks.length&&!spec;i++){
        var u2=unitAt(toks,i);
        if(u2&&(u2.m==="pc"||u2.x>=15)){for(j=0;j<u2.n;j++)used[i+j]=1;spec=u2.m==="g"?{m:"g",v:u2.x}:{m:"pc",v:1}}
      }
    }
    if(!spec)spec={m:"pc",v:1};
    var name=toks.filter(function(w,k){return !used[k]&&!STOP[w]&&!/^\d/.test(w)&&w.length>=2});
    if(!name.length){un.push(seg);return}
    var cands=matchFoods(name,H);
    if(!cands.length){un.push(seg);return}
    var food=cands[0];
    items.push({raw:seg,spec:spec,cands:cands,food:food,g:spec.m==="g"?spec.v:r1(spec.v*food.g)})
  });
  return {items:items,un:un}
}

  if(a==="vadd"){
    var added=0;
    A.v.forEach(function(it){
      var f=it.food,g=it.g;if(!(g>0))return;
      S.log[cur]=S.log[cur]||[];
      S.log[cur].push({id:newId(),m:A.m,n:f.n,fid:f.id,g:g,k:f.k*g/100,p:f.p*g/100,f:f.f*g/100,c:f.c*g/100,per:{k:f.k,p:f.p,f:f.f,c:f.c}});
      S.recent=[f.id].concat(S.recent.filter(function(x){return x!==f.id})).slice(0,30);added++
    });
    save();closeSheet();renderToday();toast(added?"Добавлено: "+added:"Нечего добавлять");return
  }
  if(a==="pantry"){openPantry();return}
  if(a==="pt"){
    var pk=el.getAttribute("data-k"),pi=S.pantry.indexOf(pk);
    if(pi>=0)S.pantry.splice(pi,1);else S.pantry.push(pk);
    save();el.setAttribute("aria-pressed",String(pi<0));var pc=$("#pcount");if(pc)pc.textContent=S.pantry.length;return
  }
  if(a==="pdone"){closeSheet();renderRecipes();return}
  if(a==="pclear"){S.pantry=[];save();renderRecipes();return}
  if(a==="rf"){RF=el.getAttribute("data-v");renderRecipes();return}
  if(a==="rshow"){RSHOW=true;renderRecipes();return}
  if(a==="ropen"){openRecipe(+el.getAttribute("data-i"));return}
  if(a==="rx"){RC.x=Math.min(8,Math.max(1,RC.x+(+el.getAttribute("data-v"))));renderRecipe();return}
  if(a==="radd"){
    var rr=RECIPES[RC.i],rm=rMacros(rr,RC.x),rmeal=RC.m,rdate=cur;
    S.log[rdate]=S.log[rdate]||[];
    S.log[rdate].push({id:newId(),m:rmeal,n:rr.n+(RC.x>1?" × "+RC.x:""),k:rm.k,p:rm.p,f:rm.f,c:rm.c});
    save();closeSheet();toast("Добавлено: "+mealName(rmeal).toLowerCase()+", "+dayTitle().toLowerCase());return
  }
  if(a==="wsearch"){webSearch();return}
  if(a==="wpick"){
    var wr=A.web&&A.web.res&&A.web.res[+el.getAttribute("data-i")];if(!wr)return;
    var ex=wr.oid?S.foods.filter(function(x){return x.oid===wr.oid})[0]:null;
    if(!ex){ex={id:"u"+newId(),n:wr.n,k:wr.k,p:wr.p,f:wr.f,c:wr.c,g:wr.g,oid:wr.oid};S.foods.push(ex);save()}
    A.food=ex;A.g=ex.g;A.back="web";A.mode="amount";renderSheet();return
  }
  if(a==="water-plus"){S.water[cur]=(S.water[cur]||0)+1;save();renderToday();return}
  if(a==="wk-add"){
    var wt=$("#wkType").value,wm=Math.max(0,r0(num($("#wkMin").value,0)));
    (S.workouts[cur]=S.workouts[cur]||[]).push({id:newId(),t:wt,min:wm});save();renderToday();toast("Тренировка добавлена");return
  }
  if(a==="wk-del"){var wid=el.getAttribute("data-id");S.workouts[cur]=(S.workouts[cur]||[]).filter(function(w){return w.id!==wid});save();renderToday();return}
  if(a==="rw"){RW=Math.min(0,RW+(+el.getAttribute("data-v")));renderProgress();return}
  if(a==="tpl-save"){
    var tm=el.getAttribute("data-m"),its=dayEntries(cur).filter(function(e){return e.m===tm});if(!its.length)return;
    var nm0=window.prompt("Название шаблона",mealName(tm));if(nm0===null)return;
    nm0=nm0.trim()||mealName(tm);
    S.tpl.push({id:newId(),n:nm0,items:its.map(function(e){var c=Object.assign({},e);delete c.id;delete c.m;return c})});save();toast("Шаблон сохранён");return
  }
  if(a==="tpl-use"){
    var tp=S.tpl.filter(function(x){return x.id===el.getAttribute("data-id")})[0];if(!tp||!A)return;
    S.log[cur]=S.log[cur]||[];
    tp.items.forEach(function(e){var c=Object.assign({},e);c.id=newId();c.m=A.m;S.log[cur].push(c)});
    save();closeSheet();renderToday();toast("Добавлено из шаблона");return
  }
  if(a==="tpl-del"){S.tpl=S.tpl.filter(function(x){return x.id!==el.getAttribute("data-id")});save();renderSheet();return}
  if(a==="add"){openAdd(el.getAttribute("data-m"));return}
  if(a==="edit"){openAdd(null,el.getAttribute("data-id"));return}
  if(a==="del"){var id=el.getAttribute("data-id");S.log[cur]=dayEntries(cur).filter(function(e){return e.id!==id});save();renderToday();return}
  if(a==="copy"){
    var m=el.getAttribute("data-m"),y=addDays(cur,-1);
    (S.log[y]||[]).filter(function(e){return e.m===m}).forEach(function(e){var c=Object.assign({},e);c.id=newId();S.log[cur]=S.log[cur]||[];S.log[cur].push(c)});
    save();renderToday();toast("Добавлено со вчера");return
  }
  if(a==="water-set"){var v=+el.getAttribute("data-v");S.water[cur]=(S.water[cur]===v)?v-1:v;save();renderToday();return}
  if(a==="steps"){S.steps[cur]=Math.max(0,r0(num($("#stepsIn").value,0)));save();renderToday();toast("Шаги сохранены");return}
  if(a==="close"){closeSheet();return}
  if(a==="cat"){if(A){A.cat=+el.getAttribute("data-v");renderSheet();var l=$("#foodList");if(l)l.scrollTop=0}return}
  if(a==="mode"){if(A){A.mode=el.getAttribute("data-v");A.quick=null;renderSheet()}return}
  if(a==="pick"){var f=foodById(el.getAttribute("data-id"));if(f){A.back=A.mode;A.food=f;A.g=f.g;A.mode="amount";renderSheet()}return}
  if(a==="fav"){var fid=el.getAttribute("data-id"),i=S.favs.indexOf(fid);if(i>=0)S.favs.splice(i,1);else S.favs.push(fid);save();$("#foodList").innerHTML=foodListHTML();return}
  if(a==="delfood"){var did=el.getAttribute("data-id");S.foods=S.foods.filter(function(f){return f.id!==did});S.favs=S.favs.filter(function(x){return x!==did});save();$("#foodList").innerHTML=foodListHTML();return}
  if(a==="commit"){
    var t=amountTotals();if(!(t.g>0)){toast("Укажи вес порции");return}
    var f2=A.food,wasEdit=!!A.edit;
    pushEntry({id:newId(),m:A.m,n:f2.n,fid:f2.id,g:t.g,k:t.k,p:t.p,f:t.f,c:t.c,per:{k:f2.k,p:f2.p,f:f2.f,c:f2.c}});
    if(f2.id){S.recent=[f2.id].concat(S.recent.filter(function(x){return x!==f2.id})).slice(0,30);save()}
    closeSheet();renderToday();toast(wasEdit?"Сохранено":"Добавлено");return
  }
  if(a==="commitq"){
    var k=num($("#qk").value,0),pp=num($("#qp").value,0),ff=num($("#qf").value,0),cc=num($("#qc").value,0),nm=$("#qn").value.trim()||"Без названия";
    if(!(k>0||pp>0||ff>0||cc>0)){toast("Впиши хотя бы калории");return}
    pushEntry({id:newId(),m:A.m,n:nm,k:k,p:pp,f:ff,c:cc});
    closeSheet();renderToday();toast("Добавлено");return
  }
  if(a==="savefood"){
    var n=$("#cn").value.trim(),kk=num($("#ck").value,NaN);
    if(!n||!isFinite(kk)){toast("Нужны название и калории");return}
    var nf={id:"u"+newId(),n:n,k:kk,p:num($("#cp").value,0),f:num($("#cf").value,0),c:num($("#cc").value,0),g:num($("#cg").value,100)||100};
    S.foods.push(nf);S.favs.push(nf.id);save();
    A.food=nf;A.g=nf.g;A.mode="amount";renderSheet();toast("Продукт сохранён");return
  }
  if(a==="weight"){
    var kg=num($("#wIn").value,NaN);
    if(!isFinite(kg)||kg<20||kg>300){toast("Проверь вес");return}
    S.weights=S.weights.filter(function(x){return x.d!==TODAY});S.weights.push({d:TODAY,kg:r1(kg)});
    S.weights.sort(function(x,y){return x.d<y.d?-1:1});save();renderProgress();toast("Вес записан");return
  }
  if(a==="delw"){var dd=el.getAttribute("data-d");S.weights=S.weights.filter(function(x){return x.d!==dd});save();renderProgress();return}
  if(a==="hue"){S.prof.hue=+el.getAttribute("data-v");save();applyHue();renderMe();return}
  if(a==="backup"){
    var txt=JSON.stringify(S),ta=$("#bk");ta.value=txt;ta.focus();ta.select();
    var done=function(){toast("Копия скопирована")};
    try{navigator.clipboard.writeText(txt).then(done,function(){toast("Выдели текст и скопируй вручную")})}catch(e){toast("Выдели текст и скопируй вручную")}
    return
  }
  if(a==="restore"){
    try{
      var r=JSON.parse($("#bk").value);
      if(!r||typeof r!=="object"||!r.prof||!r.log)throw 0;
      S=Object.assign(defaults(),r);S.prof=Object.assign(defaults().prof,r.prof);S.onb=true;save();applyHue();toast("Данные восстановлены");renderMe()
    }catch(e){toast("Не удалось прочитать копию")}
    return
  }
  if(a==="reset"){
    if(el.getAttribute("data-sure")!=="1"){el.setAttribute("data-sure","1");el.textContent="Нажми ещё раз, чтобы удалить всё";return}
    S=defaults();save();applyHue();location.hash="#today";route();return
  }
});
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="q"){A.q=t.value;$("#foodList").innerHTML=foodListHTML();return}
  if(t.id==="gr"){updPreview();return}
  if(t.id==="wq"){if(A&&A.web)A.web.q=t.value;return}
  if(t.id==="vt"){if(A)A.vtext=t.value;return}
  var vg=t.getAttribute&&t.getAttribute("data-vg");
  if(vg!==null&&vg!==undefined&&A&&A.v[+vg]){A.v[+vg].g=num(t.value,0);updVRow(+vg);return}
  var k=t.getAttribute&&t.getAttribute("data-pf");
  if(!k)return;
  var p=S.prof;
  if(t.type==="checkbox")p[k]=t.checked;
  else if(t.type==="number"){
    var v=num(t.value,NaN);if(!isFinite(v))return;
    if(k==="weight"){
      var wl=S.weights;
      if(wl.length&&wl[wl.length-1].d===TODAY)wl[wl.length-1].kg=v;else p.weight=v
    }else p[k]=v
  }else if(k==="goal"){p.goal=t.value;if(t.value==="maintain")p.sur=0;if(t.value==="muscle")p.sur=10;save();renderMe();return}
  else if(k==="act")p.act=num(t.value,p.act);
  else p[k]=t.value;
  if(k==="sur"||k==="adj")p.goal="custom";
  save();updTargets()
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.getAttribute&&t.getAttribute("data-pf")==="act"){S.prof.act=num(t.value,S.prof.act);save();updTargets()}
  if(t.id==="rmeal"&&RC)RC.m=t.value;
  var vi=t.getAttribute&&t.getAttribute("data-vi");
  if(vi!==null&&vi!==undefined&&A&&A.v[+vi]){
    var it=A.v[+vi],nf=it.cands.filter(function(c){return c.id===t.value})[0];
    if(nf){it.food=nf;if(it.spec.m==="pc")it.g=r1(it.spec.v*nf.g);var gi=$('[data-vg="'+vi+'"]');if(gi)gi.value=r0(it.g);updVRow(+vi)}
  }
});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&A)closeSheet();if(ev.key==="Enter"&&ev.target&&ev.target.id==="wq"){ev.preventDefault();webSearch()}});
function applyHue(){document.documentElement.style.setProperty("--h",S.prof.hue)}
/* v13: фон не двигается, пока открыто окно; окно подстраивается под клавиатуру */
(function(){
  var ov=document.getElementById("overlay"),y=0,locked=false,vv=window.visualViewport;
  function fit(){
    var r=document.documentElement.style;
    if(vv&&locked){r.setProperty("--vvh",vv.height+"px");r.setProperty("--vvt",vv.offsetTop+"px")}
    else{r.removeProperty("--vvh");r.removeProperty("--vvt")}
  }
  function sync(){
    var open=!!ov.firstChild;
    if(open&&!locked){
      y=window.pageYOffset||0;locked=true;
      document.body.style.top=(-y)+"px";document.body.classList.add("locked");document.documentElement.classList.add("sheet-open")
    }else if(!open&&locked){
      locked=false;document.body.classList.remove("locked");document.documentElement.classList.remove("sheet-open");
      document.body.style.top="";window.scrollTo(0,y)
    }
    fit()
  }
  new MutationObserver(sync).observe(ov,{childList:true});
  if(vv){vv.addEventListener("resize",fit);vv.addEventListener("scroll",fit)}
  document.addEventListener("focusin",function(ev){
    var t=ev.target;
    if(!locked||!t||!t.closest||!t.closest(".sheet"))return;
    setTimeout(function(){try{t.scrollIntoView({block:"center",behavior:"smooth"})}catch(e){}},350)
  })
})();
window.addEventListener("hashchange",route);
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState!=="visible")return;
  var n=ymd(new Date());
  if(n!==TODAY){var was=cur===TODAY;TODAY=n;if(was)cur=TODAY;route()}
});
applyHue();
route();
})();
</script>
